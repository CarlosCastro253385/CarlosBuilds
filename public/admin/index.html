<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>CarlosBuilds - Panel</title>
    <link href="/admin/config.yml" type="text/yaml" rel="cms-config-url" />
    <script>
      (function () {
        var tema = null;
        try {
          var forzado = new URLSearchParams(window.location.search).get('tema');
          if (forzado === 'claro' || forzado === 'oscuro') {
            tema = forzado;
            localStorage.setItem('tema-panel', forzado);
          } else {
            tema = localStorage.getItem('tema-panel');
          }
        } catch (e) {}
        if (tema !== 'claro' && tema !== 'oscuro') {
          tema = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
        }
        document.documentElement.setAttribute('data-tema', tema);
      })();
    </script>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
    <script src="/admin/preview.js"></script>
    <script src="/admin/tema.js"></script>
  </body>
</html>
