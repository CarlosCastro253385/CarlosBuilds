<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sin conexión · Panel</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #0a0b10;
        color: #e2e8f0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
      }
      main {
        max-width: 420px;
      }
      h1 {
        margin: 0 0 12px;
        font-size: 1.6rem;
        color: #00f2fe;
      }
      p {
        margin: 0 0 24px;
        color: #94a3b8;
        line-height: 1.6;
      }
      button {
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #00f2fe;
        color: #0a0b10;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Sin conexión</h1>
      <p>El panel necesita internet para cargar y guardar tus cambios. Revisa tu conexión e inténtalo de nuevo.</p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
