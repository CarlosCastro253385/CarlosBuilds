<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#0a0b10" />
    <title>Resumen · Panel CarlosBuilds</title>
    <style>
      :root {
        --bg: #0a0b10;
        --card: rgba(18, 22, 36, 0.75);
        --borde: rgba(147, 112, 219, 0.25);
        --texto: #e2e8f0;
        --suave: #94a3b8;
        --cian: #00f2fe;
        --morado: #7928ca;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      [hidden] {
        display: none !important;
      }

      body {
        min-height: 100vh;
        background-color: var(--bg);
        background-image:
          radial-gradient(circle at 15% 20%, rgba(121, 40, 202, 0.15) 0%, transparent 40%),
          radial-gradient(circle at 85% 70%, rgba(0, 242, 254, 0.1) 0%, transparent 40%);
        color: var(--texto);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.6;
      }

      .barra {
        height: 3px;
        background: linear-gradient(90deg, #00f2fe, #7928ca, #ff0080);
      }

      .contenedor {
        max-width: 1000px;
        margin: 0 auto;
        padding: 24px 20px 64px;
      }

      .cabecera {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: flex-end;
        gap: 16px;
        margin-bottom: 28px;
      }

      .etiqueta {
        font-family: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
        font-size: 0.8rem;
        color: var(--cian);
      }

      h1 {
        font-size: clamp(1.8rem, 6vw, 2.4rem);
        color: #fff;
        line-height: 1.2;
      }

      .acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--borde);
        border-radius: 999px;
        background: var(--card);
        color: #fff;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: border-color 0.2s ease, color 0.2s ease;
      }

      .btn:hover {
        border-color: var(--cian);
        color: var(--cian);
      }

      a:focus-visible {
        outline: 2px solid var(--cian);
        outline-offset: 3px;
        border-radius: 4px;
      }

      .estado {
        margin-bottom: 20px;
        font-size: 0.9rem;
        color: var(--suave);
      }

      .tarjetas {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 14px;
        margin-bottom: 24px;
      }

      .tarjeta {
        padding: 18px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        background: var(--card);
      }

      .tarjeta .num {
        font-size: 2rem;
        font-weight: 800;
        line-height: 1.1;
        color: var(--cian);
        font-variant-numeric: tabular-nums;
      }

      .tarjeta .num.chico {
        font-size: 1.25rem;
        padding-top: 0.55rem;
      }

      .tarjeta .nombre {
        margin-top: 6px;
        font-size: 0.85rem;
        color: var(--suave);
      }

      .columnas {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }

      @media (max-width: 720px) {
        .columnas {
          grid-template-columns: 1fr;
        }
      }

      .panel {
        padding: 20px;
        border: 1px solid var(--borde);
        border-radius: 14px;
        background: var(--card);
      }

      .panel h2 {
        margin-bottom: 14px;
        font-size: 1.05rem;
        color: #fff;
      }

      .lista {
        display: flex;
        flex-direction: column;
        gap: 12px;
        list-style: none;
      }

      .tag-fila {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 0.9rem;
      }

      .tag-nombre {
        flex: 0 0 38%;
        overflow-wrap: anywhere;
      }

      .tag-barra {
        flex: 1;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }

      .tag-barra > span {
        display: block;
        height: 100%;
        background: linear-gradient(90deg, var(--cian), var(--morado));
      }

      .tag-cuenta {
        min-width: 2ch;
        text-align: right;
        color: var(--suave);
        font-variant-numeric: tabular-nums;
      }

      .entrada a {
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        overflow-wrap: anywhere;
      }

      .entrada a:hover {
        color: var(--cian);
      }

      .entrada small {
        display: block;
        font-size: 0.8rem;
        color: var(--suave);
      }

      .vacio {
        font-size: 0.9rem;
        color: var(--suave);
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="barra" aria-hidden="true"></div>

    <main class="contenedor">
      <header class="cabecera">
        <div>
          <p class="etiqueta">// panel</p>
          <h1>Resumen</h1>
        </div>
        <nav class="acciones" aria-label="Accesos">
          <a class="btn" href="/admin/">✏️ Ir al editor</a>
          <a class="btn" href="/blog">📝 Ver blog</a>
          <a class="btn" id="btn-visitas" href="#" target="_blank" rel="noopener noreferrer" hidden>📈 Ver visitas</a>
        </nav>
      </header>

      <p id="estado" class="estado" role="status">Cargando datos…</p>

      <section id="tarjetas" class="tarjetas" aria-label="Totales" hidden>
        <div class="tarjeta"><div class="num" id="n-total">0</div><div class="nombre">entradas publicadas</div></div>
        <div class="tarjeta"><div class="num" id="n-mini">0</div><div class="nombre">mini proyectos</div></div>
        <div class="tarjeta"><div class="num" id="n-problemas">0</div><div class="nombre">problemas resueltos</div></div>
        <div class="tarjeta"><div class="num" id="n-tags">0</div><div class="nombre">etiquetas distintas</div></div>
        <div class="tarjeta"><div class="num chico" id="n-ultima">—</div><div class="nombre">última publicación</div></div>
      </section>

      <div id="detalle" class="columnas" hidden>
        <section class="panel" aria-labelledby="t-tags">
          <h2 id="t-tags">Etiquetas más usadas</h2>
          <ul class="lista" id="lista-tags"></ul>
        </section>
        <section class="panel" aria-labelledby="t-ultimas">
          <h2 id="t-ultimas">Últimas entradas</h2>
          <ul class="lista" id="lista-ultimas"></ul>
        </section>
      </div>
    </main>

    <script>
      (function () {
        // Cuando tengas tu cuenta de GoatCounter, escribe aquí tu código
        // (la parte antes de ".goatcounter.com"). Vacío = el botón no aparece.
        var GOATCOUNTER_CODE = 'carlosbuilds';

        var estado = document.getElementById('estado');
        var tarjetas = document.getElementById('tarjetas');
        var detalle = document.getElementById('detalle');
        var listaTags = document.getElementById('lista-tags');
        var listaUltimas = document.getElementById('lista-ultimas');
        var btnVisitas = document.getElementById('btn-visitas');

        if (GOATCOUNTER_CODE) {
          btnVisitas.href = 'https://' + GOATCOUNTER_CODE + '.goatcounter.com';
          btnVisitas.hidden = false;
        }

        function pedir(url) {
          return fetch(url).then(function (r) {
            if (!r.ok) throw new Error('Error ' + r.status);
            return r.json();
          });
        }

        function poner(id, valor) {
          document.getElementById(id).textContent = String(valor);
        }

        function crear(etiqueta, clase, texto) {
          var el = document.createElement(etiqueta);
          if (clase) el.className = clase;
          if (texto !== undefined) el.textContent = texto;
          return el;
        }

        Promise.all([pedir('/api/stats'), pedir('/api/posts')])
          .then(function (res) {
            var m = (res[0] && res[0].metrics) || {};
            var posts = ((res[1] && res[1].data) || []).slice();

            // Más recientes primero (las fechas son AAAA-MM-DD)
            posts.sort(function (a, b) {
              return String(b.date).localeCompare(String(a.date));
            });

            poner('n-total', m.totalPosts != null ? m.totalPosts : posts.length);
            poner('n-mini', m.miniProjects != null ? m.miniProjects : 0);
            poner('n-problemas', m.problemsSolved != null ? m.problemsSolved : 0);
            poner('n-tags', m.totalTags != null ? m.totalTags : 0);
            poner('n-ultima', posts.length ? posts[0].date : '—');

            // Etiquetas más usadas
            var conteo = {};
            posts.forEach(function (p) {
              (p.tags || []).forEach(function (t) {
                conteo[t] = (conteo[t] || 0) + 1;
              });
            });
            var top = Object.keys(conteo)
              .map(function (t) {
                return { tag: t, n: conteo[t] };
              })
              .sort(function (a, b) {
                return b.n - a.n || a.tag.localeCompare(b.tag);
              })
              .slice(0, 8);

            if (top.length === 0) {
              listaTags.appendChild(crear('li', 'vacio', 'Todavía no hay etiquetas.'));
            } else {
              var maximo = top[0].n;
              top.forEach(function (item) {
                var fila = crear('li', 'tag-fila');
                var barra = crear('div', 'tag-barra');
                var relleno = document.createElement('span');
                relleno.style.width = Math.round((item.n / maximo) * 100) + '%';
                barra.appendChild(relleno);
                fila.appendChild(crear('span', 'tag-nombre', '#' + item.tag));
                fila.appendChild(barra);
                fila.appendChild(crear('span', 'tag-cuenta', item.n));
                listaTags.appendChild(fila);
              });
            }

            // Últimas entradas
            if (posts.length === 0) {
              listaUltimas.appendChild(crear('li', 'vacio', 'Todavía no hay entradas.'));
            } else {
              posts.slice(0, 5).forEach(function (p) {
                var li = crear('li', 'entrada');
                var enlace = crear('a', '', p.title);
                enlace.href = '/blog/' + encodeURIComponent(p.slug);
                li.appendChild(enlace);
                li.appendChild(crear('small', '', p.category + ' · ' + p.date));
                listaUltimas.appendChild(li);
              });
            }

            tarjetas.hidden = false;
            detalle.hidden = false;
            estado.textContent =
              'Datos de tu sitio publicado. Actualizado a las ' +
              new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' }) +
              '.';
          })
          .catch(function () {
            estado.textContent =
              'No se pudieron cargar los datos. Revisa tu conexión y recarga la página.';
          });
      })();
    </script>
  </body>
</html>
